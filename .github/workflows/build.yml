name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Сборка
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Готовый файл
        run: cp app/build/outputs/apk/debug/app-debug.apk lms-admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lms-admin
          path: lms-admin.apk

      - name: Выложить в релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Последняя сборка" --notes "Свежий APK. Скачайте lms-admin.apk и установите поверх прежнего."
          fi
          gh release upload latest lms-admin.apk --clobber
